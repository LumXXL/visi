<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="VISI — Real-time speech captioning">
    <meta name="theme-color" content="#000000">
    <title>VISI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ========================
           SCREEN 1 — START
           ======================== */

        #start-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        #start-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .wordmark {
            position: absolute;
            top: 22%;
            font-size: 1.4rem;
            font-weight: 400;
            letter-spacing: 0.3em;
            color: #fff;
            text-transform: uppercase;
            user-select: none;
        }

        .start-btn {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            border: 2px solid #fff;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.08);
            transition: box-shadow 0.2s ease, transform 0.15s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .start-btn:hover,
        .start-btn:focus-visible {
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
        }

        .start-btn:active {
            transform: scale(0.96);
        }

        .start-btn-label {
            font-family: 'Inter', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            color: #fff;
            text-transform: uppercase;
            user-select: none;
        }

        .start-footer {
            position: absolute;
            bottom: 10%;
            color: #666;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            user-select: none;
        }

        /* ========================
           SCREEN 2 — CAPTIONING
           ======================== */

        #caption-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            padding: 8%;
            z-index: 5;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #caption-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        #caption-text {
            font-size: 6vw;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.2;
            letter-spacing: 0.05em;
            word-spacing: 0.1em;
            max-width: 100%;
            user-select: none;
        }

        /* Landscape: bigger text */
        @media (orientation: landscape) {
            #caption-text {
                font-size: 8vw;
            }
        }

        /* Word fade-in animation */
        .word {
            display: inline-block;
            opacity: 0;
            animation: wordFadeIn 0.12s ease-out forwards;
        }

        @keyframes wordFadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* Exit button */
        .exit-btn {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 20;
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        .exit-btn.visible {
            opacity: 0.4;
            pointer-events: auto;
        }

        .exit-btn:hover,
        .exit-btn:focus-visible {
            opacity: 0.8;
        }

        .exit-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Unsupported browser message */
        #unsupported {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            color: #666;
            font-size: 0.9rem;
            line-height: 1.6;
            padding: 15%;
            text-align: center;
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #unsupported.show {
            display: flex;
        }

        #unsupported strong {
            color: #fff;
            display: block;
            font-size: 1rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        /* Listening indicator — subtle pulse */
        .listening-dot {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .listening-dot.active {
            opacity: 0.3;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.15; transform: translateX(-50%) scale(1); }
            50%      { opacity: 0.35; transform: translateX(-50%) scale(1.3); }
        }
    </style>
</head>
<body>

    <!-- UNSUPPORTED BROWSER -->
    <div id="unsupported">
        <strong>VISI</strong>
        This browser doesn't support speech recognition.<br>
        Please open this page in <strong style="font-size:0.9rem; letter-spacing:0.1em; margin:0.5rem 0; display:inline;">Google Chrome</strong> on your phone or computer.
    </div>

    <!-- SCREEN 1 — START -->
    <div id="start-screen">
        <div class="wordmark">VISI</div>
        <button class="start-btn" id="start-btn" aria-label="Start captioning">
            <span class="start-btn-label">Start</span>
        </button>
        <div class="start-footer">Real-time captions</div>
    </div>

    <!-- SCREEN 2 — CAPTIONING -->
    <div id="caption-screen">
        <div id="caption-text"></div>
    </div>

    <!-- EXIT BUTTON (overlays caption screen) -->
    <button class="exit-btn" id="exit-btn" aria-label="Stop captioning">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
            <line x1="6" y1="6" x2="18" y2="18"/>
            <line x1="18" y1="6" x2="6" y2="18"/>
        </svg>
    </button>

    <!-- LISTENING INDICATOR -->
    <div class="listening-dot" id="listening-dot"></div>

    <script>
    // ============================================================
    // VISI v1 — Real-time speech captioning
    // Architecture: Speech Input → Text Processing → Display Output
    // ============================================================

    (function() {
        'use strict';

        // --- Check browser support ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            document.getElementById('unsupported').classList.add('show');
            document.getElementById('start-screen').style.display = 'none';
            return;
        }

        // --- DOM refs ---
        const startScreen   = document.getElementById('start-screen');
        const captionScreen = document.getElementById('caption-screen');
        const captionText   = document.getElementById('caption-text');
        const startBtn      = document.getElementById('start-btn');
        const exitBtn       = document.getElementById('exit-btn');
        const listeningDot  = document.getElementById('listening-dot');

        // --- State ---
        let isListening = false;
        let recognition  = null;
        let wakeLock     = null;

        // ============================================================
        // MODULE 1: Speech Input
        // Handles SpeechRecognition setup and events.
        // ============================================================

        function createRecognition() {
            const rec = new SpeechRecognition();
            rec.continuous       = true;
            rec.interimResults   = true;
            rec.lang             = 'en-US'; // Swap for future language support
            rec.maxAlternatives  = 1;

            rec.onresult = function(event) {
                let interim = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript;
                    } else {
                        interim += transcript;
                    }
                }

                if (finalTranscript) {
                    processText(finalTranscript, true);
                } else if (interim) {
                    processText(interim, false);
                }
            };

            rec.onend = function() {
                // Auto-restart if we're still supposed to be listening
                if (isListening) {
                    try {
                        rec.start();
                    } catch(e) {
                        // Sometimes throws if already started; safe to ignore
                    }
                }
            };

            rec.onerror = function(event) {
                // 'no-speech' and 'aborted' are normal — ignore them
                if (event.error === 'no-speech' || event.error === 'aborted') return;
                console.warn('Speech recognition error:', event.error);
            };

            return rec;
        }

        function startListening() {
            recognition = createRecognition();
            isListening = true;
            try {
                recognition.start();
            } catch(e) {
                console.warn('Could not start recognition:', e);
            }
        }

        function stopListening() {
            isListening = false;
            if (recognition) {
                try {
                    recognition.stop();
                } catch(e) {}
                recognition = null;
            }
        }

        // ============================================================
        // MODULE 2: Text Processing
        // Currently passes through. Translation slots in here later.
        // ============================================================

        function processText(text, isFinal) {
            // Future: translate(text, sourceLang, targetLang).then(display)
            displayText(text, isFinal);
        }

        // ============================================================
        // MODULE 3: Display Output
        // Renders text to the DOM with word-by-word fade animation.
        // ============================================================

        let displayedWordCount = 0;
        let clearTimer = null;

        function displayText(text, isFinal) {
            if (clearTimer) {
                clearTimeout(clearTimer);
                clearTimer = null;
            }

            const words = text.trim().split(/\s+/);
            let html = '';

            words.forEach(function(word, i) {
                // Only animate words that are new (beyond what we've already shown)
                if (i >= displayedWordCount) {
                    html += '<span class="word">' + escapeHtml(word) + '</span> ';
                } else {
                    html += '<span class="word" style="animation:none;opacity:1;">' + escapeHtml(word) + '</span> ';
                }
            });

            captionText.innerHTML = html;
            displayedWordCount = words.length;

            if (isFinal) {
                // Show final sentence for a moment, then clear
                clearTimer = setTimeout(function() {
                    captionText.innerHTML = '';
                    displayedWordCount = 0;
                }, 1200);
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ============================================================
        // SCREEN TRANSITIONS
        // ============================================================

        function enterCaptionMode() {
            captionText.innerHTML = '';
            displayedWordCount = 0;

            startScreen.classList.add('hidden');
            captionScreen.classList.add('active');
            exitBtn.classList.add('visible');
            listeningDot.classList.add('active');

            startListening();
            requestWakeLock();
        }

        function exitCaptionMode() {
            stopListening();
            releaseWakeLock();

            captionScreen.classList.remove('active');
            exitBtn.classList.remove('visible');
            listeningDot.classList.remove('active');

            // Small delay so the fade-out completes before resetting
            setTimeout(function() {
                startScreen.classList.remove('hidden');
                captionText.innerHTML = '';
                displayedWordCount = 0;
            }, 300);
        }

        // ============================================================
        // WAKE LOCK (prevent screen dimming)
        // ============================================================

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch(e) {
                    // Wake lock can fail (e.g. low battery) — non-critical
                }
            }
        }

        function releaseWakeLock() {
            if (wakeLock) {
                wakeLock.release().catch(function() {});
                wakeLock = null;
            }
        }

        // Re-acquire wake lock if page becomes visible again
        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible' && isListening) {
                requestWakeLock();
            }
        });

        // ============================================================
        // EVENT LISTENERS
        // ============================================================

        startBtn.addEventListener('click', enterCaptionMode);
        exitBtn.addEventListener('click', exitCaptionMode);

    })();
    </script>
</body>
</html>
