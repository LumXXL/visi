<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="VISI — Real-time speech captioning">
    <meta name="theme-color" content="#000000">
    <title>VISI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'ChunkFive';
            src: url('ChunkFive-Regular.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ========================
           SCREEN 1 — START
           ======================== */

        #start-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        #start-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .header-group {
            position: absolute;
            top: 14%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
        }

        .wordmark {
            font-family: 'ChunkFive', Georgia, serif;
            font-size: 3rem;
            font-weight: normal;
            letter-spacing: 0.08em;
            color: #fff;
            user-select: none;
        }

        .tagline {
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            color: #999;
            text-transform: uppercase;
            user-select: none;
        }

        /* Center group: button + footer text together */
        .center-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .start-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 1px solid #fff;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.06);
            transition: box-shadow 0.2s ease, transform 0.15s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .start-btn:hover,
        .start-btn:focus-visible {
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.12);
        }

        .start-btn:active {
            transform: scale(0.97);
        }

        .start-btn-label {
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            color: #fff;
            text-transform: uppercase;
            user-select: none;
            line-height: 1.4;
            text-align: center;
        }

        .footer-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            max-width: 300px;
        }

        .footer-text {
            color: #bbb;
            font-size: 0.85rem;
            letter-spacing: 0.03em;
            line-height: 1.5;
            text-align: center;
            user-select: none;
        }

        /* ========================
           SCREEN 2 — CAPTIONING
           ======================== */

        #caption-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            background: #000;
            padding: 6% 8%;
            z-index: 5;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #caption-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        #caption-text {
            font-size: 6vw;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.3;
            letter-spacing: 0.05em;
            word-spacing: 0.1em;
            width: 100%;
            user-select: none;
        }

        @media (orientation: landscape) {
            #caption-text {
                font-size: 8vw;
            }
        }

        .word {
            display: inline;
            opacity: 0;
            animation: wordFadeIn 0.12s ease-out forwards;
        }

        @keyframes wordFadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* Exit button */
        .exit-btn {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 20;
            width: 56px;
            height: 56px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        .exit-btn.visible {
            opacity: 0.6;
            pointer-events: auto;
        }

        .exit-btn:hover,
        .exit-btn:focus-visible {
            opacity: 1;
        }

        .exit-btn svg {
            width: 28px;
            height: 28px;
        }

        /* Unsupported browser message */
        #unsupported {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            color: #888;
            font-size: 1rem;
            line-height: 1.6;
            padding: 15%;
            text-align: center;
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #unsupported.show {
            display: flex;
        }

        #unsupported strong {
            color: #fff;
            display: block;
            font-size: 1.1rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        /* Listening indicator */
        .listening-dot {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .listening-dot.active {
            opacity: 0.3;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.15; transform: translateX(-50%) scale(1); }
            50%      { opacity: 0.35; transform: translateX(-50%) scale(1.3); }
        }
    </style>
</head>
<body>

    <!-- UNSUPPORTED BROWSER -->
    <div id="unsupported">
        <strong>VISI</strong>
        This browser doesn't support speech recognition.<br>
        Please open this page in <strong style="font-size:1rem; letter-spacing:0.1em; margin:0.5rem 0; display:inline;">Google Chrome</strong> on your phone or computer.
    </div>

    <!-- SCREEN 1 — START -->
    <div id="start-screen">
        <div class="header-group">
            <div class="wordmark">visi</div>
            <div class="tagline">Real-time captions</div>
        </div>
        <div class="center-group">
            <button class="start-btn" id="start-btn" aria-label="Start captioning">
                <span class="start-btn-label">Turn on</span>
            </button>
            <div class="footer-group">
                <div class="footer-text">A free tool that turns speech into visible text. Turn it on and go.</div>
                <div class="footer-text">Audio is processed by your browser and is not recorded or stored.</div>
            </div>
        </div>
    </div>

    <!-- SCREEN 2 — CAPTIONING -->
    <div id="caption-screen">
        <div id="caption-text"></div>
    </div>

    <!-- EXIT BUTTON -->
    <button class="exit-btn" id="exit-btn" aria-label="Stop captioning">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
            <line x1="6" y1="6" x2="18" y2="18"/>
            <line x1="18" y1="6" x2="6" y2="18"/>
        </svg>
    </button>

    <!-- LISTENING INDICATOR -->
    <div class="listening-dot" id="listening-dot"></div>

    <script>
    (function() {
        'use strict';

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            document.getElementById('unsupported').classList.add('show');
            document.getElementById('start-screen').style.display = 'none';
            return;
        }

        const startScreen   = document.getElementById('start-screen');
        const captionScreen = document.getElementById('caption-screen');
        const captionText   = document.getElementById('caption-text');
        const startBtn      = document.getElementById('start-btn');
        const exitBtn       = document.getElementById('exit-btn');
        const listeningDot  = document.getElementById('listening-dot');

        let isListening = false;
        let recognition  = null;
        let wakeLock     = null;

        // ============================================================
        // LINE MANAGEMENT
        // ============================================================

        function getMaxLines() {
            const vh = window.innerHeight;
            const isLandscape = window.innerWidth > window.innerHeight;

            if (isLandscape && vh < 500) {
                return 3;
            } else if (isLandscape) {
                return 4;
            } else if (vh < 900) {
                return 6;
            } else {
                return 8;
            }
        }

        function measureLineCount() {
            if (!captionText.textContent.trim()) return 0;
            const lineHeight = parseFloat(getComputedStyle(captionText).lineHeight);
            const textHeight = captionText.scrollHeight;
            return Math.round(textHeight / lineHeight);
        }

        // ============================================================
        // MODULE 1: Speech Input
        // ============================================================

        function createRecognition() {
            const rec = new SpeechRecognition();
            rec.continuous       = true;
            rec.interimResults   = true;
            rec.lang             = 'en-US';
            rec.maxAlternatives  = 1;

            rec.onresult = function(event) {
                let interim = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript;
                    } else {
                        interim += transcript;
                    }
                }

                if (finalTranscript) {
                    processText(finalTranscript, true);
                } else if (interim) {
                    processText(interim, false);
                }
            };

            rec.onend = function() {
                if (isListening) {
                    try { rec.start(); } catch(e) {}
                }
            };

            rec.onerror = function(event) {
                if (event.error === 'no-speech' || event.error === 'aborted') return;
                console.warn('Speech recognition error:', event.error);
            };

            return rec;
        }

        function startListening() {
            recognition = createRecognition();
            isListening = true;
            try { recognition.start(); } catch(e) {}
        }

        function stopListening() {
            isListening = false;
            if (recognition) {
                try { recognition.stop(); } catch(e) {}
                recognition = null;
            }
        }

        // ============================================================
        // MODULE 2: Text Processing (translation slots in here later)
        // ============================================================

        function processText(text, isFinal) {
            displayText(text, isFinal);
        }

        // ============================================================
        // MODULE 3: Display Output
        // ============================================================

        let displayedWordCount = 0;
        let clearTimer = null;
        let committedHTML = '';

        function displayText(text, isFinal) {
            if (clearTimer) {
                clearTimeout(clearTimer);
                clearTimer = null;
            }

            const words = text.trim().split(/\s+/);
            let currentHTML = '';

            words.forEach(function(word, i) {
                if (i >= displayedWordCount) {
                    currentHTML += '<span class="word">' + escapeHtml(word) + '</span> ';
                } else {
                    currentHTML += '<span class="word" style="animation:none;opacity:1;">' + escapeHtml(word) + '</span> ';
                }
            });

            captionText.innerHTML = committedHTML + currentHTML;
            displayedWordCount = words.length;

            var lineCount = measureLineCount();
            var maxLines = getMaxLines();

            if (lineCount > maxLines) {
                committedHTML = '';
                captionText.innerHTML = currentHTML;
            }

            if (isFinal) {
                var finalHTML = '';
                words.forEach(function(word) {
                    finalHTML += '<span class="word" style="animation:none;opacity:1;">' + escapeHtml(word) + '</span> ';
                });
                committedHTML += finalHTML;
                captionText.innerHTML = committedHTML;
                displayedWordCount = 0;

                var newLineCount = measureLineCount();
                if (newLineCount >= maxLines) {
                    clearTimer = setTimeout(function() {
                        committedHTML = '';
                        captionText.innerHTML = '';
                        displayedWordCount = 0;
                    }, 1500);
                }
            }
        }

        function escapeHtml(str) {
            var div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ============================================================
        // SCREEN TRANSITIONS
        // ============================================================

        function enterCaptionMode() {
            captionText.innerHTML = '';
            committedHTML = '';
            displayedWordCount = 0;
            startScreen.classList.add('hidden');
            captionScreen.classList.add('active');
            exitBtn.classList.add('visible');
            listeningDot.classList.add('active');
            startListening();
            requestWakeLock();
        }

        function exitCaptionMode() {
            stopListening();
            releaseWakeLock();
            captionScreen.classList.remove('active');
            exitBtn.classList.remove('visible');
            listeningDot.classList.remove('active');
            setTimeout(function() {
                startScreen.classList.remove('hidden');
                captionText.innerHTML = '';
                committedHTML = '';
                displayedWordCount = 0;
            }, 300);
        }

        // ============================================================
        // WAKE LOCK
        // ============================================================

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
            }
        }

        function releaseWakeLock() {
            if (wakeLock) {
                wakeLock.release().catch(function() {});
                wakeLock = null;
            }
        }

        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible' && isListening) {
                requestWakeLock();
            }
        });

        // ============================================================
        // EVENT LISTENERS
        // ============================================================

        startBtn.addEventListener('click', enterCaptionMode);
        exitBtn.addEventListener('click', exitCaptionMode);

    })();
    </script>
</body>
</html>
